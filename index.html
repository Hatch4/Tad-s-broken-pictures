<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tad's Broken Pictures</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f0f0f0;
    text-align: center;
  }
  #startScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #dff6ff;
  }
  #startScreen h1 {
    font-size: 2.5em;
    margin-bottom: 20px;
  }
  #startScreen img {
    max-width: 300px;
    margin-bottom: 20px;
  }
  #startScreen button {
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
  }
  #gameScreen {
    display: none;
    padding: 20px;
  }
  #timerDisplay {
    font-size: 20px;
    margin-bottom: 10px;
  }
  canvas {
    background: white;
    border: 2px solid #333;
  }
</style>
</head>
<body>

<!-- Start Screen -->
<div id="startScreen">
  <h1>Tad's Broken Pictures</h1>
  <img id="startImage" src="frog.png" alt="Frog">
  <button onclick="startLevel(0)">Start Game</button>
</div>

<!-- Game Screen -->
<div id="gameScreen">
  <div id="timerDisplay">Time: 0</div>
  <canvas id="gameCanvas" width="500" height="500"></canvas>
</div>

<script>

// Game levels configuration (all files in same folder as HTML)
const levels = [
  { img: 'image1.jpg', size: 2, time: 10 },
  { img: 'image2.jpg', size: 3, time: 35 },
  { img: 'image3.jpg', size: 4, time: 50 },
  { img: 'image4.jpg', size: 5, time: 75 }
];

// Game state variables
let currentLevel = 0;
let pieces = [];
let pieceSize;
let puzzleImage = new Image();
let draggingPiece = null;
let offsetX, offsetY;
let timer;
let timeLeft;
let failCount = [0, 0, 0, 0];

// Sounds
const completionSounds = [
  new Audio("sound1.mp3"),
  new Audio("sound2.mp3"),
  new Audio("sound3.mp3"),
  new Audio("Sound4.mp3")
];
const failSound = new Audio("fail.mp3");

// Start a level
function startLevel(levelIndex) {
  currentLevel = levelIndex;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';

  const { img, size, time } = levels[levelIndex];
  puzzleImage.src = img;
  puzzleImage.onload = () => {
    createGrid(size);
    timeLeft = time;
    startTimer();
  };
}
function createGrid(gridSize) {
  const ctx = document.getElementById('gameCanvas').getContext('2d');
  const canvas = ctx.canvas;

  pieceSize = canvas.width / gridSize;
  pieces = [];

  // Create puzzle pieces with correct positions
  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize; col++) {
      pieces.push({
        correctRow: row,
        correctCol: col,
        x: Math.random() * (canvas.width - pieceSize),
        y: Math.random() * (canvas.height - pieceSize),
        locked: false
      });
    }
  }

  drawPuzzle();

  // Mouse events
  canvas.onmousedown = (e) => {
    const pos = getMousePos(canvas, e);
    draggingPiece = getPieceAt(pos);
    if (draggingPiece && !draggingPiece.locked) {
      offsetX = pos.x - draggingPiece.x;
      offsetY = pos.y - draggingPiece.y;
    }
  };

  canvas.onmousemove = (e) => {
    if (draggingPiece && !draggingPiece.locked) {
      const pos = getMousePos(canvas, e);
      draggingPiece.x = pos.x - offsetX;
      draggingPiece.y = pos.y - offsetY;
      drawPuzzle();
    }
  };

  canvas.onmouseup = () => {
    if (draggingPiece && !draggingPiece.locked) {
      // Snap to correct position if close enough
      const correctX = draggingPiece.correctCol * pieceSize;
      const correctY = draggingPiece.correctRow * pieceSize;
      if (Math.abs(draggingPiece.x - correctX) < 10 &&
          Math.abs(draggingPiece.y - correctY) < 10) {
        draggingPiece.x = correctX;
        draggingPiece.y = correctY;
        draggingPiece.locked = true;
        checkCompletion(gridSize);
      }
      drawPuzzle();
    }
    draggingPiece = null;
  };
}

function drawPuzzle() {
  const ctx = document.getElementById('gameCanvas').getContext('2d');
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

  pieces.forEach(piece => {
    ctx.drawImage(
      puzzleImage,
      piece.correctCol * pieceSize, piece.correctRow * pieceSize, pieceSize, pieceSize,
      piece.x, piece.y, pieceSize, pieceSize
    );
    ctx.strokeRect(piece.x, piece.y, pieceSize, pieceSize);
  });
}

function getMousePos(canvas, evt) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: evt.clientX - rect.left,
    y: evt.clientY - rect.top
  };
}

function getPieceAt(pos) {
  for (let i = pieces.length - 1; i >= 0; i--) {
    const p = pieces[i];
    if (pos.x > p.x && pos.x < p.x + pieceSize &&
        pos.y > p.y && pos.y < p.y + pieceSize) {
      return p;
    }
  }
  return null;
}
function startTimer() {
  const timerDisplay = document.getElementById('timerDisplay');
  timerDisplay.textContent = `Time: ${timeLeft}`;

  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    timerDisplay.textContent = `Time: ${timeLeft}`;

    if (timeLeft <= 0) {
      clearInterval(timer);
      failSound.play();
      failCount[currentLevel]++;

      if (currentLevel < levels.length - 1) {
        setTimeout(() => startLevel(currentLevel + 1), 1500);
      } else {
        alert("⏳ Time's up! Game over.");
        resetGame();
      }
    }
  }, 1000);
}

function checkCompletion(gridSize) {
  const allLocked = pieces.every(p => p.locked);

  if (allLocked) {
    clearInterval(timer);
    completionSounds[currentLevel].play();

    if (currentLevel < levels.length - 1) {
      setTimeout(() => startLevel(currentLevel + 1), 1500);
    } else {
      alert("🎉 Congratulations! You completed all puzzles!");
      resetGame();
    }
  }
}

function resetGame() {
  clearInterval(timer);
  pieces = [];
  draggingPiece = null;
  currentLevel = 0;
  failCount = [0, 0, 0, 0];
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
}

// Allow pressing Escape to reset
document.addEventListener('keydown', e => {
  if (e.key === "Escape") {
    resetGame();
  }
});
</script>
</body>
</html>
