<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tad's Broken Pictures</title>

<style>
  body { 
    font-family: sans-serif; 
    text-align: center; 
    background: #f0f0f0; 
    margin: 0; 
  }

  /* Shared screen styling */
  #startScreen,
  #instructionScreen,
  #winScreen {
    display: none;
    height: 100vh;
    background: url('pond.png') no-repeat center center;
    background-size: cover;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  #startScreen { display: flex; }

  #startContent {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255, 255, 255, 0.8);
    padding: 20px;
    border-radius: 10px;
  }

  #startContent img {
    max-width: 100px;
    height: auto;
  }

  #startContent button {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    background-color: #4CAF50;
    color: white;
    border-radius: 5px;
    transition: background-color 0.3s;
  }

  #startContent button:hover {
    background-color: #45a049;
  }

  #instructionScreen img,
  #winScreen img {
    width: 500px;
    height: 500px;
    z-index: 2;
  }

  .textBox {
    background: rgba(255,255,255,0.85);
    padding: 20px;
    border-radius: 10px;
    max-width: 600px;
    font-size: 20px;
    margin-top: 20px;
    z-index: 2;
  }

  #instructionScreen button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 20px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    z-index: 2;
  }

  #gameScreen { 
    display: none; 
    flex-direction: column; 
    align-items: center; 
  }

  #puzzleArea { margin-top: 10px; }
  canvas { background: #ddd; touch-action: none; max-width: 95vw; height: auto; }
  #nextButton { margin-top: 10px; padding: 8px 16px; font-size: 16px; }
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen">
  <div id="startContent">
    <img src="frog.png" alt="Frog">
    <button onclick="playStartSoundAndBegin()">Start Game</button>
  </div>
</div>

<!-- INSTRUCTION SCREEN -->
<div id="instructionScreen">
  <img src="frog.png" alt="Frog">
  <div class="textBox">
    Help me fix my pictures! Slide the tiles into the correct position to continue to the next picture.
    Remember you must be quick like a tadpole if you want to beat the timer.
  </div>
  <button onclick="beginGame()">Continue</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <div id="timerDisplay">Time: 0</div>
  <div id="puzzleArea">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
  </div>
  <button id="nextButton" onclick="goToNextLevel()">Next Puzzle</button>
</div>

<!-- WIN SCREEN -->
<div id="winScreen">
  <canvas id="fireworksCanvas"
          style="position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>

  <img src="frog.png" alt="Frog">

  <div class="textBox">
    You should go check the path of the unknown for Kran.  
    He may know more about where Bill could be.
  </div>
</div>

<script>
// ================== iOS AUDIO UNLOCK ==================
let audioUnlocked = false;
let audioCtx;

function unlockAudio() {
    if (!audioUnlocked) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);

        audioUnlocked = true;
    }
}

function playSound(file) {
    if (!audioUnlocked) unlockAudio();
    const audio = new Audio(file);
    audio.play().catch(e => console.log("iOS blocked:", e));
}

// ================== VARIABLES ==================
let levels = [
  { img: 'image1.png', size: 2, time: 10 },
  { img: 'image2.png', size: 3, time: 35 },
  { img: 'image3.png', size: 4, time: 50 },
  { img: 'image4.png', size: 5, time: 75 }
];

let currentLevel = 0;
let puzzleImage = new Image();
let gridSize, pieceSize;
let pieces = [];
let draggedPiece = null;
let dragOffsetX = 0, dragOffsetY = 0;
let dragX = 0, dragY = 0;
let timer, timeLeft;
let failCounts = [];
let scrambleTimeout;
let levelCompleted = false;

// ================== START / INSTRUCTION ==================
function playStartSoundAndBegin() {
  unlockAudio();
  playSound('start.mp3');
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('instructionScreen').style.display = 'flex';
}

function beginGame() {
  document.getElementById('instructionScreen').style.display = 'none';
  startLevel(0);
}

// ================== DRAWING FUNCTIONS ==================
function drawFullImage() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(puzzleImage, 0, 0, canvas.width, canvas.height);
}

function drawPuzzle() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  pieces.forEach(piece => {
    const sx = piece.correctCol * pieceSize;
    const sy = piece.correctRow * pieceSize;
    const dx = piece.currentCol * (canvas.width / gridSize);
    const dy = piece.currentRow * (canvas.height / gridSize);
    const size = canvas.width / gridSize;

    ctx.drawImage(puzzleImage, sx, sy, pieceSize, pieceSize, dx, dy, size, size);

    if (piece.locked) {
      ctx.strokeStyle = "lime";
      ctx.lineWidth = 3;
      ctx.strokeRect(dx, dy, size, size);
    }
  });
}

// ================== GAME SETUP ==================
function startLevel(levelIndex) {
  currentLevel = levelIndex;
  levelCompleted = false;

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('instructionScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  document.getElementById('nextButton').style.display = 'none';

  const { img, size } = levels[levelIndex];
  gridSize = size;
  puzzleImage.src = img;
  puzzleImage.onload = () => {
    createGrid(size);
  };
}

function createGrid(size) {
  const canvas = document.getElementById('gameCanvas');
  pieceSize = puzzleImage.width / size;

  pieces = [];
  for (let row = 0; row < size; row++) {
    for (let col = 0; col < size; col++) {
      pieces.push({
        correctRow: row,
        correctCol: col,
        currentRow: row,
        currentCol: col,
        locked: false
      });
    }
  }

  drawFullImage();

  clearTimeout(scrambleTimeout);
  scrambleTimeout = setTimeout(() => {
    shufflePieces();
    lockCorrectPieces();
    drawPuzzle();
    enableDragAndDrop(size);

    if (!failCounts[currentLevel] || failCounts[currentLevel] < 2) {
      startTimer();
    } else {
      document.getElementById('timerDisplay').textContent = "No Timer (Relax Mode)";
    }
  }, 2000);
}

// ================== PUZZLE HELPERS ==================
function shufflePieces() {
  for (let i = pieces.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pieces[i].currentRow, pieces[j].currentRow] = [pieces[j].currentRow, pieces[i].currentRow];
    [pieces[i].currentCol, pieces[j].currentCol] = [pieces[j].currentCol, pieces[i].currentCol];
  }
}

function lockCorrectPieces() {
  pieces.forEach(piece => {
    piece.locked = (piece.currentRow === piece.correctRow && piece.currentCol === piece.correctCol);
  });
}

function getPieceAt(x, y) {
  const col = Math.floor(x / (500 / gridSize));
  const row = Math.floor(y / (500 / gridSize));
  return pieces.find(p => p.currentRow === row && p.currentCol === col);
}

// ================== DRAG & DROP ==================
function enableDragAndDrop(size) {
  const canvas = document.getElementById('gameCanvas');

  function getCanvasCoords(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    if (evt.touches && evt.touches.length > 0) {
      return {
        x: (evt.touches[0].clientX - rect.left) * scaleX,
        y: (evt.touches[0].clientY - rect.top) * scaleY
      };
    } else if (evt.changedTouches && evt.changedTouches.length > 0) {
      return {
        x: (evt.changedTouches[0].clientX - rect.left) * scaleX,
        y: (evt.changedTouches[0].clientY - rect.top) * scaleY
      };
    } else {
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY
      };
    }
  }

  function startDrag(x, y) {
    draggedPiece = getPieceAt(x, y);
    if (!draggedPiece || draggedPiece.locked) {
      draggedPiece = null;
      return;
    }
    dragOffsetX = x - draggedPiece.currentCol * (canvas.width / size);
    dragOffsetY = y - draggedPiece.currentRow * (canvas.height / size);
  }

  function moveDrag(x, y) {
    if (draggedPiece) {
      dragX = x - dragOffsetX;
      dragY = y - dragOffsetY;
      drawPuzzle();
      const ctx = canvas.getContext('2d');
      const sx = draggedPiece.correctCol * pieceSize;
      const sy = draggedPiece.correctRow * pieceSize;
      ctx.drawImage(puzzleImage, sx, sy, pieceSize, pieceSize, dragX, dragY, canvas.width / size, canvas.height / size);
    }
  }

  function endDrag(x, y) {
    if (draggedPiece) {
        const originalRow = draggedPiece.currentRow;
        const originalCol = draggedPiece.currentCol;

        const col = Math.floor(x / (canvas.width / size));
        const row = Math.floor(y / (canvas.height / size));

        const targetPiece = getPieceAt(x, y);

        if (targetPiece && !targetPiece.locked) {
            [draggedPiece.currentRow, targetPiece.currentRow] =
                [targetPiece.currentRow, draggedPiece.currentRow];
            [draggedPiece.currentCol, targetPiece.currentCol] =
                [targetPiece.currentCol, draggedPiece.currentCol];

        } else if (!targetPiece) {
            draggedPiece.currentRow = row;
            draggedPiece.currentCol = col;

        } else {
            draggedPiece.currentRow = originalRow;
            draggedPiece.currentCol = originalCol;
        }

        lockCorrectPieces();
        drawPuzzle();
        checkCompletion();
        draggedPiece = null;
    }
  }

  canvas.onmousedown = e => {
    const pos = getCanvasCoords(e);
    startDrag(pos.x, pos.y);
  };
  canvas.onmousemove = e => {
    const pos = getCanvasCoords(e);
    moveDrag(pos.x, pos.y);
  };
  canvas.onmouseup = e => {
    const pos = getCanvasCoords(e);
    endDrag(pos.x, pos.y);
  };

  canvas.ontouchstart = e => {
    const pos = getCanvasCoords(e);
    startDrag(pos.x, pos.y);
  };
  canvas.ontouchmove = e => {
    const pos = getCanvasCoords(e);
    moveDrag(pos.x, pos.y);
  };
  canvas.ontouchend = e => {
    const pos = getCanvasCoords(e);
    endDrag(pos.x, pos.y);
  };
}

// ================== TIMER & LEVEL PROGRESSION ==================
function startTimer() {
  timeLeft = levels[currentLevel].time;
  document.getElementById('timerDisplay').textContent = `Time: ${timeLeft}`;
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timerDisplay').textContent = `Time: ${timeLeft}`;
    if (timeLeft <= 0) {
      clearInterval(timer);
      handleLevelFail();
    }
  }, 1000);
}

function handleLevelFail() {
  if (levelCompleted) return;

  if (!failCounts[currentLevel]) failCounts[currentLevel] = 0;
  failCounts[currentLevel]++;

  playSound('fail.mp3');

  alert("⏳ Time's up! Try again.");
  startLevel(currentLevel);
}

function checkCompletion() {
  if (levelCompleted) return;

  const allCorrect = pieces.every(p => p.locked);
  if (allCorrect) {
    levelCompleted = true;
    clearInterval(timer);

    playSound(`sound${currentLevel + 1}.mp3`);

    document.getElementById('nextButton').style.display = 'inline-block';
  }
}

// ================== FIREWORKS & WIN SCREEN ==================
function startFireworks() {
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];

    function spawnFirework() {
        const x = Math.random() * canvas.width;
        const y = canvas.height;
        const speed = 5 + Math.random() * 3;
        const color = `hsl(${Math.random()*360},100%,50%)`;

        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 2,
            vy: -speed,
            color,
            exploded: false,
            children: []
        });
    }

    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
            if (!p.exploded) {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;

                if (p.vy > 0) {
                    p.exploded = true;
                    for (let i = 0; i < 30; i++) {
                        p.children.push({
                            x: p.x,
                            y: p.y,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            life: 40,
                            color: p.color
                        });
                    }
                }

                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            }

            p.children.forEach(c => {
                c.x += c.vx;
                c.y += c.vy;
                c.vy += 0.05;
                c.life--;

                ctx.fillStyle = c.color;
                ctx.fillRect(c.x, c.y, 3, 3);
            });

            p.children = p.children.filter(c => c.life > 0);
        });

        particles = particles.filter(p => p.children.length > 0 || !p.exploded);

        requestAnimationFrame(update);
    }

    setInterval(spawnFirework, 500);
    update();
}

function goToNextLevel() {
  currentLevel++;
  if (currentLevel < levels.length) {
    startLevel(currentLevel);
  } else {
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('winScreen').style.display = 'flex';
    startFireworks();
  }
}
</script>
</body>
</html>
