<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tad's Broken Pictures</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #cceeff;
    margin: 0;
    padding: 0;
  }
  #startScreen, #gameScreen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  #startScreen {
    display: flex;
  }
  #gameCanvas {
    border: 4px solid #333;
    background: #88cc88;
    touch-action: none;
  }
  #timerDisplay {
    font-size: 20px;
    margin: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="startScreen">
  <h1>Tad's Broken Pictures</h1>
  <img id="startImage" src="frog.png" alt="Frog" width="200">
  <button onclick="startLevel(0)">Start Game</button>
</div>

<div id="gameScreen">
  <div id="timerDisplay">Time: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <button id="nextButton" style="display:none; margin-top:10px;" onclick="goToNextLevel()">Next Puzzle</button>
</div>
<script>
const levels = [
  { img: 'image1.png', size: 2, time: 10 },
  { img: 'image2.png', size: 3, time: 35 },
  { img: 'image3.png', size: 4, time: 50 },
  { img: 'image4.png', size: 5, time: 75 }
];

let currentLevel = 0;
let pieces = [];
let pieceSize;
let puzzleImage = new Image();
let timer;
let timeLeft;
let draggedPiece = null;
let gameStartedOnce = false;
let scrambleTimeout;
let failCounts = {}; // Track fails per level
let gridSize;

// Sounds (optional)
const startSound = new Audio("start.mp3"); startSound.onerror = () => null;
const successSound = new Audio("success.mp3"); successSound.onerror = () => null;
const completionSounds = [
  new Audio("sound1.mp3"),
  new Audio("sound2.mp3"),
  new Audio("sound3.mp3"),
  new Audio("sound4.mp3")
].map(s => { s.onerror = () => null; return s; });
const failSound = new Audio("fail.mp3"); failSound.onerror = () => null;

function startLevel(levelIndex) {
  if (!gameStartedOnce) {
    if (startSound) startSound.play();
    gameStartedOnce = true;
  }

  currentLevel = levelIndex;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  document.getElementById('nextButton').style.display = 'none';

  const { img, size } = levels[levelIndex];
  gridSize = size;
  puzzleImage.src = img;
  puzzleImage.onload = () => {
    createGrid(size);
  };
}

function createGrid(size) {
  const canvas = document.getElementById('gameCanvas');
  pieceSize = canvas.width / size;

  pieces = [];
  for (let row = 0; row < size; row++) {
    for (let col = 0; col < size; col++) {
      pieces.push({
        correctRow: row,
        correctCol: col,
        currentRow: row,
        currentCol: col,
        locked: false
      });
    }
  }

  drawFullImage();
  clearTimeout(scrambleTimeout);
  scrambleTimeout = setTimeout(() => {
    shufflePieces();
    lockCorrectPieces();
    drawPuzzle();
    enableDragAndDrop(size);

    if (!failCounts[currentLevel] || failCounts[currentLevel] < 2) {
      startTimer();
    } else {
      document.getElementById('timerDisplay').textContent = "No Timer (Relax Mode)";
    }
  }, 2000);
}

function shufflePieces() {
  for (let i = pieces.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pieces[i].currentRow, pieces[j].currentRow] = [pieces[j].currentRow, pieces[i].currentRow];
    [pieces[i].currentCol, pieces[j].currentCol] = [pieces[j].currentCol, pieces[i].currentCol];
  }
}

function lockCorrectPieces() {
  pieces.forEach(piece => {
    if (piece.currentRow === piece.correctRow && piece.currentCol === piece.correctCol) {
      piece.locked = true;
    }
  });
}
function drawFullImage() {
  const ctx = document.getElementById('gameCanvas').getContext('2d');
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.drawImage(puzzleImage, 0, 0, ctx.canvas.width, ctx.canvas.height);
}

function drawPuzzle() {
  const ctx = document.getElementById('gameCanvas').getContext('2d');
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

  pieces.forEach(piece => {
    ctx.drawImage(
      puzzleImage,
      piece.correctCol * pieceSize, piece.correctRow * pieceSize, pieceSize, pieceSize,
      piece.currentCol * pieceSize, piece.currentRow * pieceSize, pieceSize, pieceSize
    );
    ctx.strokeRect(piece.currentCol * pieceSize, piece.currentRow * pieceSize, pieceSize, pieceSize);
  });
}

function enableDragAndDrop(size) {
  const canvas = document.getElementById('gameCanvas');

  canvas.onmousedown = e => startDrag(e);
  canvas.onmouseup = e => endDrag(e);
  canvas.onmousemove = e => dragMove(e);

  canvas.ontouchstart = e => startDrag(e.touches[0]);
  canvas.ontouchend = e => endDrag(e.changedTouches[0]);
  canvas.ontouchmove = e => dragMove(e.touches[0]);

  function startDrag(e) {
    const pos = getMousePos(canvas, e);
    const piece = getPieceAtGrid(pos, size);
    if (piece && !piece.locked) {
      draggedPiece = piece;
      draggedPiece.originalRow = piece.currentRow;
      draggedPiece.originalCol = piece.currentCol;
    }
  }

  function dragMove(e) {
    if (!draggedPiece) return;
    // Optional: could add visual feedback here
  }

  function endDrag(e) {
    if (!draggedPiece) return;
    const pos = getMousePos(canvas, e);
    const targetPiece = getPieceAtGrid(pos, size);

    if (targetPiece && targetPiece !== draggedPiece) {
      if (targetPiece.locked) {
        // Can't swap with a locked piece — snap back
        draggedPiece.currentRow = draggedPiece.originalRow;
        draggedPiece.currentCol = draggedPiece.originalCol;
      } else {
        // ✅ Proper swap: exchange positions
        const tempRow = targetPiece.currentRow;
        const tempCol = targetPiece.currentCol;

        targetPiece.currentRow = draggedPiece.originalRow;
        targetPiece.currentCol = draggedPiece.originalCol;

        draggedPiece.currentRow = tempRow;
        draggedPiece.currentCol = tempCol;
      }
    }

    // ✅ Lock dragged piece if correct
    if (
      draggedPiece.currentRow === draggedPiece.correctRow &&
      draggedPiece.currentCol === draggedPiece.correctCol &&
      !draggedPiece.locked
    ) {
      draggedPiece.locked = true;
      if (successSound) successSound.play();
    }

    // ✅ Lock target piece if correct after swap
    if (
      targetPiece &&
      targetPiece.currentRow === targetPiece.correctRow &&
      targetPiece.currentCol === targetPiece.correctCol &&
      !targetPiece.locked
    ) {
      targetPiece.locked = true;
      if (successSound) successSound.play();
    }

    draggedPiece = null;
    drawPuzzle();
    checkCompletion();
  }
}

function getMousePos(canvas, evt) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: evt.clientX - rect.left,
    y: evt.clientY - rect.top
  };
}

function getPieceAtGrid(pos, size) {
  const col = Math.floor(pos.x / pieceSize);
  const row = Math.floor(pos.y / pieceSize);
  return pieces.find(p => p.currentRow === row && p.currentCol === col);
}
function startTimer() {
  const { time } = levels[currentLevel];
  timeLeft = time;
  document.getElementById('timerDisplay').textContent = `Time: ${timeLeft}`;

  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timerDisplay').textContent = `Time: ${timeLeft}`;
    if (timeLeft <= 0) {
      clearInterval(timer);
      if (failSound) failSound.play();

      failCounts[currentLevel] = (failCounts[currentLevel] || 0) + 1;

      if (failCounts[currentLevel] < 2) {
        alert("⏳ Time's up! Try again.");
        startLevel(currentLevel); // Restart with timer
      } else {
        alert("⏳ Time's up! Timer disabled for this puzzle.");
        startLevel(currentLevel); // Restart without timer
      }
    }
  }, 1000);
}

function checkCompletion() {
  const allCorrect = pieces.every(p => p.locked);
  if (allCorrect) {
    clearInterval(timer);
    if (completionSounds[currentLevel]) completionSounds[currentLevel].play();
    document.getElementById('nextButton').style.display = 'inline-block';
  }
}

function goToNextLevel() {
  document.getElementById('nextButton').style.display = 'none';
  if (currentLevel < levels.length - 1) {
    startLevel(currentLevel + 1);
  } else {
    alert("🎉 All puzzles complete!");
    resetGame();
  }
}

function resetGame() {
  clearInterval(timer);
  currentLevel = 0;
  pieces = [];
  failCounts = {};
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
}

// Allow pressing Escape to reset
document.addEventListener('keydown', e => {
  if (e.key === "Escape") {
    resetGame();
  }
});
</script>
</body>
</html>
