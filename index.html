<!DOCTYPE html>
<html>
<head>
  <title>Tad's Broken Pictures</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      text-align: center;
    }
    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('pond.png') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #startScreen img {
      width: 150px;
      height: auto;
      margin-bottom: 20px;
    }
    #startScreen h1 {
      font-size: 3em;
      color: white;
      text-shadow: 2px 2px 4px black;
      margin-bottom: 20px;
    }
    #startButton {
      padding: 15px 30px;
      font-size: 1.5em;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }
    #startButton:hover {
      background-color: #45a049;
    }
    #timerDisplay {
      font-size: 1.5em;
      margin-top: 10px;
    }
    canvas {
      background-color: #222;
      display: block;
      margin: 20px auto;
      border: 2px solid white;
    }
  </style>
</head>
<body>

<div id="startScreen">
  <img src="frog.png" alt="Frog">
  <h1>Tad's Broken Pictures</h1>
  <button id="startButton">Start Game</button>
</div>

<div id="timerDisplay">Time: 0</div>
<canvas id="gameCanvas" width="600" height="600"></canvas>
<script>
  // Load start sound
  let startSound = new Audio('start.mp3');

  // Try autoplay on page load
  window.addEventListener('load', () => {
    startSound.play().catch(() => {
      console.log("Autoplay blocked, will play on button click.");
    });
  });

  // Start button click
  document.getElementById('startButton').addEventListener('click', () => {
    startSound.play();
    document.getElementById('startScreen').style.display = 'none';
    startGame();
  });

  // Level data
  const levels = [
    { src: 'image1.png', grid: 2, time: 10 },
    { src: 'image2.png', grid: 3, time: 35 },
    { src: 'image3.png', grid: 4, time: 50 },
    { src: 'image4.png', grid: 5, time: 75 }
  ];

  let currentLevel = 0;
  let timer;
  let timeLeft;
  let puzzleImage = new Image();
  let pieces = [];
  let pieceWidth, pieceHeight;
  let draggingPiece = null;
  let offsetX, offsetY;

  function startGame() {
    currentLevel = 0;
    startLevel(currentLevel);
  }

  function startLevel(levelIndex) {
    const level = levels[levelIndex];
    timeLeft = level.time;
    document.getElementById('timerDisplay').textContent = "Time: " + timeLeft;

    puzzleImage.onload = function() {
      createGrid(level.grid);
      startTimer();
    };
    puzzleImage.src = level.src;
  }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft--;
      document.getElementById('timerDisplay').textContent = "Time: " + timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        gameOver();
      }
    }, 1000);
  }
  function createGrid(gridSize) {
    const ctx = document.getElementById('gameCanvas').getContext('2d');
    const canvas = ctx.canvas;

    pieceWidth = canvas.width / gridSize;
    pieceHeight = canvas.height / gridSize;

    // Create pieces with correct positions
    pieces = [];
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        pieces.push({
          correctCol: col,
          correctRow: row,
          col: col,
          row: row,
          locked: false
        });
      }
    }

    // Shuffle pieces
    pieces.sort(() => Math.random() - 0.5);

    // Assign shuffled positions
    pieces.forEach((p, i) => {
      p.col = i % gridSize;
      p.row = Math.floor(i / gridSize);
    });

    drawPuzzle(ctx, gridSize);
    setupDragAndDrop(ctx, gridSize);
  }

  function drawPuzzle(ctx, gridSize) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    pieces.forEach(p => {
      ctx.drawImage(
        puzzleImage,
        p.correctCol * pieceWidth, p.correctRow * pieceHeight, pieceWidth, pieceHeight,
        p.col * pieceWidth, p.row * pieceHeight, pieceWidth, pieceHeight
      );
    });
  }

  function setupDragAndDrop(ctx, gridSize) {
    const canvas = ctx.canvas;

    canvas.onmousedown = e => startDrag(e, ctx, gridSize);
    canvas.onmousemove = e => drag(e, ctx, gridSize);
    canvas.onmouseup = e => endDrag(e, ctx, gridSize);

    // Touch support
    canvas.ontouchstart = e => startDrag(e.touches[0], ctx, gridSize);
    canvas.ontouchmove = e => { e.preventDefault(); drag(e.touches[0], ctx, gridSize); };
    canvas.ontouchend = e => endDrag(e.changedTouches[0], ctx, gridSize);
  }
  function getMousePos(canvas, e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function startDrag(e, ctx, gridSize) {
    const mousePos = getMousePos(ctx.canvas, e);
    const col = Math.floor(mousePos.x / pieceWidth);
    const row = Math.floor(mousePos.y / pieceHeight);

    draggingPiece = pieces.find(p => p.col === col && p.row === row && !p.locked);
    if (draggingPiece) {
      offsetX = mousePos.x - col * pieceWidth;
      offsetY = mousePos.y - row * pieceHeight;
    }
  }

  function drag(e, ctx, gridSize) {
    if (!draggingPiece) return;
    const mousePos = getMousePos(ctx.canvas, e);
    drawPuzzle(ctx, gridSize);

    // Draw dragged piece following mouse
    ctx.globalAlpha = 0.8;
    ctx.drawImage(
      puzzleImage,
      draggingPiece.correctCol * pieceWidth, draggingPiece.correctRow * pieceHeight, pieceWidth, pieceHeight,
      mousePos.x - offsetX, mousePos.y - offsetY, pieceWidth, pieceHeight
    );
    ctx.globalAlpha = 1;
  }

  function endDrag(e, ctx, gridSize) {
    if (!draggingPiece) return;

    const mousePos = getMousePos(ctx.canvas, e);
    const dropCol = Math.floor(mousePos.x / pieceWidth);
    const dropRow = Math.floor(mousePos.y / pieceHeight);

    // Find piece currently in drop location
    const targetPiece = pieces.find(p => p.col === dropCol && p.row === dropRow);

    if (targetPiece && targetPiece !== draggingPiece && !targetPiece.locked) {
      // Swap positions
      [draggingPiece.col, targetPiece.col] = [targetPiece.col, draggingPiece.col];
      [draggingPiece.row, targetPiece.row] = [targetPiece.row, draggingPiece.row];
    } else {
      // Snap back to original position
    }

    // Lock if correct
    pieces.forEach(p => {
      if (p.col === p.correctCol && p.row === p.correctRow) {
        p.locked = true;
      }
    });

    drawPuzzle(ctx, gridSize);
    draggingPiece = null;

    // Check if puzzle is solved
    if (pieces.every(p => p.locked)) {
      clearInterval(timer);
      setTimeout(() => {
        currentLevel++;
        if (currentLevel < levels.length) {
          startLevel(currentLevel);
        } else {
          alert("🎉 Congratulations! You solved all puzzles!");
          startGame();
        }
      }, 500);
    }
  }

  function gameOver() {
    alert("⏳ Time's up! Try again.");
    startGame();
  }
</script>
</body>
</html>
