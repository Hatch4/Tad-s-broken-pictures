<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tad's Broken Pictures</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #cceeff;
    margin: 0;
    padding: 0;
  }
  #startScreen, #gameScreen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  #startScreen {
    display: flex;
  }
  #gameCanvas {
    border: 4px solid #333;
    background: #88cc88;
    touch-action: none;
  }
  #timerDisplay {
    font-size: 20px;
    margin: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="startScreen">
  <h1>Tad's Broken Pictures</h1>
  <img id="startImage" src="frog.png" alt="Frog" width="200">
  <button onclick="startLevel(0)">Start Game</button>
</div>

<div id="gameScreen">
  <div id="timerDisplay">Time: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <button id="nextButton" style="display:none; margin-top:10px;" onclick="goToNextLevel()">Next Puzzle</button>
</div>
<script>
const levels = [
  { img: 'image1.png', size: 2, time: 10 },
  { img: 'image2.png', size: 3, time: 35 },
  { img: 'image3.png', size: 4, time: 50 },
  { img: 'image4.png', size: 5, time: 75 }
];

let currentLevel = 0;
let pieces = [];
let pieceSize;
let puzzleImage = new Image();
let timer;
let timeLeft;
let draggedPiece = null;

// Optional sounds (won’t break if missing)
const completionSounds = [
  new Audio("sound1.mp3"),
  new Audio("sound2.mp3"),
  new Audio("sound3.mp3"),
  new Audio("sound4.mp3")
].map(s => { s.onerror = () => null; return s; });

const failSound = new Audio("fail.mp3");
failSound.onerror = () => null;

function startLevel(levelIndex) {
  currentLevel = levelIndex;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  document.getElementById('nextButton').style.display = 'none';

  const { img, size } = levels[levelIndex];
  puzzleImage.src = img;
  puzzleImage.onload = () => {
    createGrid(size);
  };
}
function createGrid(gridSize) {
  const canvas = document.getElementById('gameCanvas');
  pieceSize = canvas.width / gridSize;

  // Create ordered grid
  pieces = [];
  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize; col++) {
      pieces.push({
        correctRow: row,
        correctCol: col,
        currentRow: row,
        currentCol: col
      });
    }
  }

  // Show full image for 2 seconds before scrambling
  drawFullImage();
  setTimeout(() => {
    shufflePieces();
    drawPuzzle();
    enableDragAndDrop(gridSize);
    startTimer();
  }, 2000);
}

function drawFullImage() {
  const ctx = document.getElementById('gameCanvas').getContext('2d');
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.drawImage(puzzleImage, 0, 0, ctx.canvas.width, ctx.canvas.height);
}

function shufflePieces() {
  for (let i = pieces.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pieces[i].currentRow, pieces[j].currentRow] = [pieces[j].currentRow, pieces[i].currentRow];
    [pieces[i].currentCol, pieces[j].currentCol] = [pieces[j].currentCol, pieces[i].currentCol];
  }
}

function drawPuzzle() {
  const ctx = document.getElementById('gameCanvas').getContext('2d');
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

  // Draw pond background
  const pond = new Image();
  pond.src = 'pond.png';
  ctx.drawImage(pond, 0, 0, ctx.canvas.width, ctx.canvas.height);

  // Draw all pieces except the one being dragged
  pieces.forEach(piece => {
    if (piece !== draggedPiece) {
      ctx.drawImage(
        puzzleImage,
        piece.correctCol * pieceSize, piece.correctRow * pieceSize, pieceSize, pieceSize,
        piece.currentCol * pieceSize, piece.currentRow * pieceSize, pieceSize, pieceSize
      );
      ctx.strokeRect(piece.currentCol * pieceSize, piece.currentRow * pieceSize, pieceSize, pieceSize);
    }
  });

  // Draw dragged piece last so it overlaps others
  if (draggedPiece) {
    ctx.globalAlpha = 0.85;
    ctx.drawImage(
      puzzleImage,
      draggedPiece.correctCol * pieceSize, draggedPiece.correctRow * pieceSize, pieceSize, pieceSize,
      draggedPiece.currentCol * pieceSize, draggedPiece.currentRow * pieceSize, pieceSize, pieceSize
    );
    ctx.strokeRect(draggedPiece.currentCol * pieceSize, draggedPiece.currentRow * pieceSize, pieceSize, pieceSize);
    ctx.globalAlpha = 1.0;
  }
}

function enableDragAndDrop(gridSize) {
  const canvas = document.getElementById('gameCanvas');

  canvas.onmousedown = (e) => startDrag(e);
  canvas.onmouseup = (e) => endDrag(e);
  canvas.onmousemove = (e) => dragMove(e);

  canvas.ontouchstart = (e) => startDrag(e.touches[0]);
  canvas.ontouchend = (e) => endDrag(e.changedTouches[0]);
  canvas.ontouchmove = (e) => dragMove(e.touches[0]);

  function startDrag(e) {
    const pos = getMousePos(canvas, e);
    draggedPiece = getPieceAtGrid(pos, gridSize);
  }

  function dragMove(e) {
    if (!draggedPiece) return;
    const pos = getMousePos(canvas, e);
    draggedPiece.currentCol = Math.floor(pos.x / pieceSize);
    draggedPiece.currentRow = Math.floor(pos.y / pieceSize);
    drawPuzzle();
  }

  function endDrag(e) {
    if (!draggedPiece) return;
    const pos = getMousePos(canvas, e);
    const targetPiece = getPieceAtGrid(pos, gridSize);

    if (targetPiece && targetPiece !== draggedPiece) {
      [draggedPiece.currentRow, targetPiece.currentRow] = [targetPiece.currentRow, draggedPiece.currentRow];
      [draggedPiece.currentCol, targetPiece.currentCol]
      [draggedPiece.currentCol, targetPiece.currentCol] = [targetPiece.currentCol, draggedPiece.currentCol];
    }
    draggedPiece = null;
    drawPuzzle();
    checkCompletion();
  }
}

function getMousePos(canvas, evt) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: evt.clientX - rect.left,
    y: evt.clientY - rect.top
  };
}

function getPieceAtGrid(pos, gridSize) {
  const col = Math.floor(pos.x / pieceSize);
  const row = Math.floor(pos.y / pieceSize);
  return pieces.find(p => p.currentRow === row && p.currentCol === col);
}
function startTimer() {
  const { time } = levels[currentLevel];
  timeLeft = time;
  document.getElementById('timerDisplay').textContent = `Time: ${timeLeft}`;

  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timerDisplay').textContent = `Time: ${timeLeft}`;
    if (timeLeft <= 0) {
      clearInterval(timer);
      if (failSound) failSound.play();
      alert("⏳ Time's up! Try again.");
      startLevel(currentLevel); // Restart same puzzle
    }
  }, 1000);
}

function checkCompletion() {
  const allCorrect = pieces.every(p => p.currentRow === p.correctRow && p.currentCol === p.correctCol);
  if (allCorrect) {
    clearInterval(timer);
    if (completionSounds[currentLevel]) completionSounds[currentLevel].play();
    document.getElementById('nextButton').style.display = 'inline-block';
  }
}

function goToNextLevel() {
  document.getElementById('nextButton').style.display = 'none';
  if (currentLevel < levels.length - 1) {
    startLevel(currentLevel + 1);
  } else {
    alert("🎉 All puzzles complete!");
    resetGame();
  }
}

function resetGame() {
  clearInterval(timer);
  currentLevel = 0;
  pieces = [];
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
}

// Allow pressing Escape to reset
document.addEventListener('keydown', e => {
  if (e.key === "Escape") {
    resetGame();
  }
});
</script>
</body>
</html>
