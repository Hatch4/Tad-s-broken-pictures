<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tad's Broken Pictures</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: black;
  }
  /* Start Screen Styles */
  #startScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('pond.png') no-repeat center center;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  #startScreen h1 {
    font-size: 3em;
    color: white;
    text-shadow: 2px 2px 4px black;
    margin-bottom: 20px;
  }
  #startContent {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  #startCharacter {
    height: 120px;
    width: auto;
    pointer-events: none;
  }
  #startButton {
    padding: 15px 30px;
    font-size: 1.5em;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
  }
  #startButton:hover {
    background-color: #45a049;
  }
</style>
</head>
<body>

<!-- Start Screen -->
<div id="startScreen">
  <h1>Tad's Broken Pictures</h1>
  <div id="startContent">
    <img id="startCharacter" src="frog.png" alt="Frog">
    <button id="startButton">Start Game</button>
  </div>
</div>

<!-- Game Canvas -->
<canvas id="gameCanvas" width="800" height="600"></canvas>
<div id="timerDisplay" style="color:white; font-size:20px; padding:10px;">Time: 0</div>

<script>
  // Start screen sound
  let startSound = new Audio('start.mp3');

  // Play sound when page loads
  window.addEventListener('load', () => {
    startSound.play().catch(() => {
      console.log("Autoplay blocked, will play on button click.");
    });
  });

  // Start button click
  document.getElementById('startButton').addEventListener('click', () => {
    startSound.pause();
    startSound.currentTime = 0;
    document.getElementById('startScreen').style.display = 'none';
    startGame();
  });

  // Game start
  function startGame() {
    currentLevel = 0;
    startLevel(currentLevel);
  }

  // Level data
  const levels = [
    { src: 'image1.png', grid: 2, time: 10 },
    { src: 'image2.png', grid: 3, time: 35 },
    { src: 'image3.png', grid: 4, time: 50 },
    { src: 'image4.png', grid: 5, time: 75 }
  ];

  let currentLevel = 0;
  let timer;
  let timeLeft;
  let puzzleImage = new Image();
  let pieces = [];
  let pieceWidth, pieceHeight;
  let draggingPiece = null;
  let offsetX, offsetY;
  let offsetXCenter = 0;
  let offsetYCenter = 0;

  function startLevel(levelIndex) {
    const level = levels[levelIndex];
    timeLeft = level.time;
    document.getElementById('timerDisplay').textContent = "Time: " + timeLeft;

    puzzleImage.onload = function() {
      scrambleImage(level.grid);
      startTimer();
    };
    puzzleImage.src = level.src;
  }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft--;
      document.getElementById('timerDisplay').textContent = "Time: " + timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        gameOver();
      }
    }, 1000);
  }

  function scrambleImage(gridSize) {
    const ctx = document.getElementById('gameCanvas').getContext('2d');
    const canvas = ctx.canvas;

    pieceWidth = Math.floor(canvas.width / (gridSize + 1));
    pieceHeight = Math.floor(canvas.height / (gridSize + 1));

    // Center offsets
    offsetXCenter = (canvas.width - (pieceWidth * gridSize)) / 2;
    offsetYCenter = (canvas.height - (pieceHeight * gridSize)) / 2;

    // Create pieces array
    pieces = [];
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        pieces.push({
          correctX: col * pieceWidth,
          correctY: row * pieceHeight,
          x: col * pieceWidth,
          y: row * pieceHeight
        });
      }
    }

    // Shuffle pieces
    pieces.sort(() => Math.random() - 0.5);

    // Assign shuffled positions
    pieces.forEach((p, i) => {
      p.x = (i % gridSize) * pieceWidth;
      p.y = Math.floor(i / gridSize) * pieceHeight;
    });

    drawPuzzle(ctx);
    setupDragAndDrop(ctx, gridSize);
  }

  function drawPuzzle(ctx) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    pieces.forEach(p => {
      ctx.drawImage(
        puzzleImage,
        p.correctX, p.correctY, pieceWidth, pieceHeight,
        p.x + offsetXCenter, p.y + offsetYCenter, pieceWidth, pieceHeight
      );
    });
  }

  function setupDragAndDrop(ctx, gridSize) {
    const canvas = ctx.canvas;

    canvas.onmousedown = e => startDrag(e, ctx);
    canvas.onmousemove = e => drag(e, ctx);
    canvas.onmouseup = e => endDrag(e, ctx, gridSize);

    // Touch support
    canvas.ontouchstart = e => startDrag(e.touches[0], ctx);
    canvas.ontouchmove = e => { e.preventDefault(); drag(e.touches[0], ctx); };
    canvas.ontouchend = e => endDrag(e.changedTouches[0], ctx, gridSize);
  }

  function startDrag(e, ctx) {
    const mousePos = getMousePos(ctx.canvas, e);
    draggingPiece = pieces.find(p =>
      mousePos.x > p.x + offsetXCenter && mousePos.x < p.x + offsetXCenter + pieceWidth &&
      mousePos.y > p.y + offsetYCenter && mousePos.y < p.y + offsetYCenter + pieceHeight
    );
    if (draggingPiece) {
      offsetX = mousePos.x - (draggingPiece.x + offsetXCenter);
      offsetY = mousePos.y - (draggingPiece.y + offsetYCenter);
    }
  }

  function drag(e, ctx) {
    if (!draggingPiece) return;
    const mousePos = getMousePos(ctx.canvas, e);
    draggingPiece.x = mousePos.x - offsetXCenter - offsetX;
    draggingPiece.y = mousePos.y - offsetYCenter - offsetY;
    drawPuzzle(ctx);
  }

  function endDrag(e, ctx, gridSize) {
    if (!draggingPiece) return;
    const mousePos = getMousePos(ctx.canvas, e);

    // Find drop slot
    const dropCol = Math.floor((mousePos.x - offsetXCenter) / pieceWidth);
    const dropRow = Math.floor((mousePos.y - offsetYCenter) / pieceHeight);

    if (dropCol >= 0 && dropCol < gridSize && dropRow >= 0 && dropRow < gridSize) {
      const targetX = dropCol * pieceWidth;
      const targetY = dropRow * pieceHeight;

      // Find the piece currently in that slot
      const targetPiece = pieces.find(p => p.x === targetX && p.y === targetY);

      if (targetPiece && targetPiece !== draggingPiece) {
        // Swap positions
        const tempX = draggingPiece.x;
        const tempY = draggingPiece.y;
        draggingPiece.x = targetPiece.x;
        draggingPiece.y = targetPiece.y;
        targetPiece.x = tempX;
        targetPiece.y = tempY;
      } else {
        // Snap to nearest slot
        draggingPiece.x = targetX;
        draggingPiece.y = targetY;
      }
    }

    drawPuzzle(ctx);
    draggingPiece = null;

    // Check if puzzle is solved
    if (pieces.every(p => p.x === p.correctX && p.y === p.correctY)) {
      clearInterval(timer);
      setTimeout(() => {
        currentLevel++;
        if (currentLevel < levels.length) {
          startLevel(currentLevel);
        } else {
          alert("🎉 You completed all puzzles!");
          document.getElementById('startScreen').style.display = 'flex';
        }
      }, 500);
    }
  }

  function getMousePos(canvas, e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function gameOver() {
    alert('⏳ Time up!');
    document.getElementById('startScreen').style.display = 'flex';
  }
</script>

</body>
</html>
