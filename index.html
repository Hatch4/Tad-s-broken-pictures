<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Broken Pictures Puzzle Game</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f0f0f0;
  }
  #startScreen, #gameScreen {
    display: none;
  }
  canvas {
    background: #fff;
    border: 2px solid #333;
    cursor: grab;
  }
  #timerDisplay {
    font-size: 20px;
    margin: 10px;
  }
</style>
</head>
<body>

<div id="startScreen">
  <h1>Broken Pictures</h1>
  <img id="startImage" src="pond.png" alt="Pond" style="max-width:300px;">
  


  <button onclick="startLevel(0)">Start Game</button>
</div>

<div id="gameScreen">
  <div id="timerDisplay"></div>
  <canvas id="gameCanvas" width="600" height="600"></canvas>
</div>

<script>
// Game levels configuration
const levels = [
  { img: 'image1.jpg', size: 2, time: 10 },
  { img: 'image2.jpg', size: 3, time: 35 },
  { img: 'image3.jpg', size: 4, time: 50 },
  { img: 'image4.jpg', size: 5, time: 75 }
];

// Game state variables
let currentLevel = 0;
let pieces = [];
let pieceSize;
let puzzleImage = new Image();
let draggingPiece = null;
let offsetX, offsetY;
let timer;
let timeLeft;
let failCount = [0, 0, 0, 0];

// Sounds (Level 4 uses capital S to match your file)
const completionSounds = [
  new Audio("sound1.mp3"),
  new Audio("sound2.mp3"),
  new Audio("sound3.mp3"),
  new Audio("Sound4.mp3")
];
const failSound = new Audio("fail.mp3");

// Show start screen on load
window.onload = () => {
  document.getElementById('startScreen').style.display = 'block';
};

// Start a level
function startLevel(levelIndex) {
  currentLevel = levelIndex;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';

  const { img, size, time } = levels[levelIndex];
  puzzleImage.src = img;
  puzzleImage.onload = () => {
    createGrid(size);
    timeLeft = time;
    startTimer();
  };
}
function createGrid(gridSize) {
  const ctx = document.getElementById('gameCanvas').getContext('2d');
  const canvas = ctx.canvas;

  pieceSize = canvas.width / gridSize;
  pieces = [];

  // Create pieces with correct positions
  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize; col++) {
      pieces.push({
        correctCol: col,
        correctRow: row,
        col: col,
        row: row,
        locked: false
      });
    }
  }

  // Shuffle pieces
  pieces.sort(() => Math.random() - 0.5);
  pieces.forEach((p, i) => {
    p.col = i % gridSize;
    p.row = Math.floor(i / gridSize);
  });

  drawPuzzle(ctx, gridSize);
  setupDragAndDrop(ctx, gridSize);
}

function drawPuzzle(ctx, gridSize) {
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

  // ✅ Cut from the image's natural size to avoid slivers
  const imgPieceWidth = puzzleImage.width / gridSize;
  const imgPieceHeight = puzzleImage.height / gridSize;

  pieces.forEach(p => {
    ctx.drawImage(
      puzzleImage,
      p.correctCol * imgPieceWidth, p.correctRow * imgPieceHeight, imgPieceWidth, imgPieceHeight,
      p.col * pieceSize, p.row * pieceSize, pieceSize, pieceSize
    );
  });
}
function setupDragAndDrop(ctx, gridSize) {
  const canvas = ctx.canvas;

  // Mouse Down — pick up a piece
  canvas.onmousedown = e => {
    const mousePos = getMousePos(canvas, e);
    const clickedPiece = getPieceAt(mousePos, gridSize);

    if (clickedPiece && !clickedPiece.locked) {
      draggingPiece = clickedPiece;
      offsetX = mousePos.x - draggingPiece.col * pieceSize;
      offsetY = mousePos.y - draggingPiece.row * pieceSize;
    }
  };

  // Mouse Move — drag the piece
  canvas.onmousemove = e => {
    if (draggingPiece) {
      const mousePos = getMousePos(canvas, e);
      draggingPiece.col = (mousePos.x - offsetX) / pieceSize;
      draggingPiece.row = (mousePos.y - offsetY) / pieceSize;
      drawPuzzle(ctx, gridSize);
    }
  };

  // Mouse Up — drop the piece
  canvas.onmouseup = e => {
    if (draggingPiece) {
      const dropCol = Math.round(draggingPiece.col);
      const dropRow = Math.round(draggingPiece.row);

      // Snap to grid
      draggingPiece.col = dropCol;
      draggingPiece.row = dropRow;

      // Lock if correct
      if (dropCol === draggingPiece.correctCol && dropRow === draggingPiece.correctRow) {
        draggingPiece.locked = true;
      }

      draggingPiece = null;
      drawPuzzle(ctx, gridSize);
      checkCompletion(gridSize);
    }
  };
}
function getMousePos(canvas, evt) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: evt.clientX - rect.left,
    y: evt.clientY - rect.top
  };
}

function getPieceAt(pos, gridSize) {
  const col = Math.floor(pos.x / pieceSize);
  const row = Math.floor(pos.y / pieceSize);
  return pieces.find(p => p.col === col && p.row === row);
}
function checkCompletion(gridSize) {
  const allLocked = pieces.every(p => p.locked);

  if (allLocked) {
    clearInterval(timer);
    completionSounds[currentLevel].play();

    // Move to next level or end game
    if (currentLevel < levels.length - 1) {
      setTimeout(() => startLevel(currentLevel + 1), 1500);
    } else {
      alert("🎉 Congratulations! You completed all puzzles!");
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('startScreen').style.display = 'block';
    }
  }
}
function startTimer() {
  const timerDisplay = document.getElementById('timerDisplay');
  timerDisplay.textContent = `Time: ${timeLeft}`;

  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    timerDisplay.textContent = `Time: ${timeLeft}`;

    if (timeLeft <= 0) {
      clearInterval(timer);
      failSound.play();
      failCount[currentLevel]++;

      if (currentLevel < levels.length - 1) {
        setTimeout(() => startLevel(currentLevel + 1), 1500);
      } else {
        alert("⏳ Time's up! Game over.");
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('startScreen').style.display = 'block';
      }
    }
  }, 1000);
}
function resetGame() {
  clearInterval(timer);
  pieces = [];
  draggingPiece = null;
  currentLevel = 0;
  failCount = [0, 0, 0, 0];
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'block';
}

// Allow pressing Escape to reset
document.addEventListener('keydown', e => {
  if (e.key === "Escape") {
    resetGame();
  }
});
</script>
</body>
</html>
