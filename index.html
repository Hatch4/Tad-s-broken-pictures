<!DOCTYPE html>
<html>
<head>
  <title>Tad's Broken Pictures</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      text-align: center;
    }
    /* Start Screen Styles */
    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('pond.png') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #startScreen h1 {
      font-size: 3em;
      color: white;
      text-shadow: 2px 2px 4px black;
      margin-bottom: 20px;
    }
    #startButton {
      padding: 15px 30px;
      font-size: 1.5em;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }
    #startButton:hover {
      background-color: #45a049;
    }
    #timerDisplay {
      font-size: 1.5em;
      margin-top: 10px;
    }
    canvas {
      background-color: #222;
      display: block;
      margin: 20px auto;
      border: 2px solid white;
    }
  </style>
</head>
<body>

<div id="startScreen">
  <h1>Tad's Broken Pictures</h1>
  <button id="startButton">Start Game</button>
</div>

<div id="timerDisplay">Time: 0</div>
<canvas id="gameCanvas" width="600" height="600"></canvas>
<script>
  // Start screen sound
  let startSound = new Audio('start.mp3');

  window.addEventListener('load', () => {
    startSound.play().catch(() => {
      console.log("Autoplay blocked, will play on button click.");
    });
  });

  document.getElementById('startButton').addEventListener('click', () => {
    startSound.pause();
    startSound.currentTime = 0;
    document.getElementById('startScreen').style.display = 'none';
    startGame();
  });

  const levels = [
    { src: 'image1.png', grid: 2, time: 10 },
    { src: 'image2.png', grid: 3, time: 35 },
    { src: 'image3.png', grid: 4, time: 50 },
    { src: 'image4.png', grid: 5, time: 75 }
  ];

  let currentLevel = 0;
  let timer;
  let timeLeft;
  let puzzleImage = new Image();
  let pieces = [];
  let pieceWidth, pieceHeight;
  let draggingPiece = null;
  let offsetX, offsetY;
  let offsetXCenter = 0;
  let offsetYCenter = 0;

  function startGame() {
    currentLevel = 0;
    startLevel(currentLevel);
  }

  function startLevel(levelIndex) {
    const level = levels[levelIndex];
    timeLeft = level.time;
    document.getElementById('timerDisplay').textContent = "Time: " + timeLeft;

    puzzleImage.onload = function() {
      scrambleImage(level.grid);
      startTimer();
    };
    puzzleImage.src = level.src;
  }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft--;
      document.getElementById('timerDisplay').textContent = "Time: " + timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        gameOver();
      }
    }, 1000);
  }
  function scrambleImage(gridSize) {
    const ctx = document.getElementById('gameCanvas').getContext('2d');
    const canvas = ctx.canvas;

    pieceWidth = Math.floor(canvas.width / gridSize);
    pieceHeight = Math.floor(canvas.height / gridSize);

    // Center offsets
    offsetXCenter = (canvas.width - (pieceWidth * gridSize)) / 2;
    offsetYCenter = (canvas.height - (pieceHeight * gridSize)) / 2;

    // Create pieces array
    pieces = [];
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        pieces.push({
          correctX: col * pieceWidth,
          correctY: row * pieceHeight,
          x: 0,
          y: 0,
          locked: false
        });
      }
    }

    // Shuffle pieces
    pieces.sort(() => Math.random() - 0.5);

    // Assign shuffled positions
    pieces.forEach((p, i) => {
      p.x = (i % gridSize) * pieceWidth;
      p.y = Math.floor(i / gridSize) * pieceHeight;
    });

    drawPuzzle(ctx);
    setupDragAndDrop(ctx, gridSize);
  }

  function drawPuzzle(ctx) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    pieces.forEach(p => {
      ctx.drawImage(
        puzzleImage,
        p.correctX, p.correctY, pieceWidth, pieceHeight,
        p.x + offsetXCenter, p.y + offsetYCenter, pieceWidth, pieceHeight
      );
    });
  }

  function setupDragAndDrop(ctx, gridSize) {
    const canvas = ctx.canvas;

    canvas.onmousedown = e => startDrag(e, ctx);
    canvas.onmousemove = e => drag(e, ctx);
    canvas.onmouseup = e => endDrag(e, ctx, gridSize);

    // Touch support
    canvas.ontouchstart = e => startDrag(e.touches[0], ctx);
    canvas.ontouchmove = e => { e.preventDefault(); drag(e.touches[0], ctx); };
    canvas.ontouchend = e => endDrag(e.changedTouches[0], ctx, gridSize);
  }
  function getMousePos(canvas, e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left - offsetXCenter,
      y: e.clientY - rect.top - offsetYCenter
    };
  }

  function startDrag(e, ctx) {
    const mousePos = getMousePos(ctx.canvas, e);
    draggingPiece = pieces.find(p =>
      !p.locked &&
      mousePos.x > p.x && mousePos.x < p.x + pieceWidth &&
      mousePos.y > p.y && mousePos.y < p.y + pieceHeight
    );
    if (draggingPiece) {
      offsetX = mousePos.x - draggingPiece.x;
      offsetY = mousePos.y - draggingPiece.y;
    }
  }

  function drag(e, ctx) {
    if (!draggingPiece) return;
    const mousePos = getMousePos(ctx.canvas, e);
    draggingPiece.x = mousePos.x - offsetX;
    draggingPiece.y = mousePos.y - offsetY;
    drawPuzzle(ctx);
  }

  function endDrag(e, ctx, gridSize) {
    if (!draggingPiece) return;

    // Snap threshold
    const snapThreshold = 10;
    if (Math.abs(draggingPiece.x - draggingPiece.correctX) < snapThreshold &&
        Math.abs(draggingPiece.y - draggingPiece.correctY) < snapThreshold) {
      draggingPiece.x = draggingPiece.correctX;
      draggingPiece.y = draggingPiece.correctY;
      draggingPiece.locked = true;
    } else {
      // Snap to nearest grid slot
      draggingPiece.x = Math.round(draggingPiece.x / pieceWidth) * pieceWidth;
      draggingPiece.y = Math.round(draggingPiece.y / pieceHeight) * pieceHeight;
    }

    drawPuzzle(ctx);
    draggingPiece = null;

    // Check if puzzle is solved
    if (pieces.every(p => p.x === p.correctX && p.y === p.correctY)) {
      clearInterval(timer);
      setTimeout(() => {
        currentLevel++;
        if (currentLevel < levels.length) {
          startLevel(currentLevel);
        } else {
          alert("🎉 Congratulations! You solved all puzzles!");
          startGame();
        }
      }, 500);
    }
  }

  function gameOver() {
    alert("⏳ Time's up! Try again.");
    startGame();
  }
</script>
</body>
</html>
